server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hr-agent-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hr_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

hr-agent:
  jwt:
    secret: ${JWT_SECRET:hr-agent-dev-secret-change-me-in-production-32chars}
    expire-hours: ${JWT_EXPIRE_HOURS:12}
  auth:
    # 无 token 时放行的路径
    whitelist:
      - /api/auth/login
      - /error
