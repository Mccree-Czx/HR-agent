server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hr-agent-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hr_agent}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

hr-agent:
  jwt:
    secret: ${JWT_SECRET:hr-agent-dev-secret-change-me-in-production-32chars}
    expire-hours: ${JWT_EXPIRE_HOURS:12}
  auth:
    # 无 token 时放行的路径
    whitelist:
      - /api/auth/login
      - /error
  ai:
    # OpenAI 兼容接口(DeepSeek 默认;Qwen: https://dashscope.aliyuncs.com/compatible-mode/v1;GLM: https://open.bigmodel.cn/api/paas/v4)
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
  notify:
    # 飞书自定义机器人 webhook(留空则仅日志告警;开启加签时同步配置 secret)
    feishu-webhook: ${FEISHU_WEBHOOK:}
    feishu-secret: ${FEISHU_SECRET:}
  auto-recruit:
    # 自动招聘闭环总开关(默认关闭,启动时用 AUTO_RECRUIT_ENABLED=true 显式开启)
    enabled: ${AUTO_RECRUIT_ENABLED:false}
    # 单轮单岗位打招呼上限(取消小批量保护,近似放开:符合即打招呼;可用 env 调整)
    greet-batch-limit: ${AUTO_RECRUIT_GREET_BATCH_LIMIT:50}
    # 单轮「在线简历详情」读取上限(只读平台调用,与推荐批次同量级)
    resume-detail-batch-limit: ${AUTO_RECRUIT_RESUME_DETAIL_BATCH_LIMIT:20}
    # 相邻两次简历详情读取的最小间隔(毫秒,读操作轻节流)
    resume-detail-interval-millis: ${AUTO_RECRUIT_RESUME_DETAIL_INTERVAL_MILLIS:1000}
    # 会话列表拉取失败后的轮内重试等待(毫秒)
    poll-retry-delay-millis: ${AUTO_RECRUIT_POLL_RETRY_DELAY_MILLIS:20000}
  storage:
    type: ${STORAGE_TYPE:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:hr-agent-minio}
      secret-key: ${MINIO_SECRET_KEY:hr-agent-minio-pass}
      bucket: ${MINIO_BUCKET:resumes}
